<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Meet Emad and Vahid Armoun. Software engineering, design, and traditional animation.">
  <title>Armoun Family</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #edf3fa; background: #0d1b2a; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { font: inherit; color: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid #a9cfff; outline-offset: 6px; }
    .app { height: 100%; height: 100dvh; display: grid; place-items: center; padding: clamp(16px, 4vw, 56px); background: radial-gradient(ellipse at 50% 0%, #243c56 0%, #0d1b2a 65%); }
    .view { grid-area: 1 / 1; width: min(100%, 880px); }
    [hidden] { display: none !important; }
    .heading { text-align: center; margin-bottom: clamp(20px, 5vh, 48px); }
    .eyebrow { color: #adbed0; letter-spacing: .2em; text-transform: uppercase; font-size: .875rem; margin: 0 0 12px; }
    h1 { font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 500; letter-spacing: -.04em; margin: 0; }
    .people { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px, 3vw, 32px); max-width: 740px; margin: auto; }
    .person { cursor: pointer; padding: 0; text-align: left; border: 1px solid #ffffff20; border-radius: 22px; background: #1b2d41; overflow: hidden; box-shadow: 0 20px 50px #0003; transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease; }
    @media (hover: hover) { .person:hover { transform: translateY(-8px); border-color: #9bbbdc88; box-shadow: 0 28px 60px #0005; } }
    .person img { display: block; width: 100%; height: clamp(140px, 36vh, 340px); object-fit: cover; object-position: center 30%; }
    .person-label { display: block; padding: clamp(16px, 2.8vw, 26px); }
    .name { display: block; font-size: clamp(1.1rem, 2.5vw, 1.65rem); font-weight: 500; letter-spacing: -.025em; }
    .role { display: block; margin-top: 8px; color: #adbed0; font-size: .875rem; line-height: 1.4; }
    .back { display: inline-flex; align-items: center; gap: 10px; background: transparent; border: 0; padding: 10px 0; margin-bottom: 18px; cursor: pointer; color: #c0d0e1; }
    .back:hover { color: white; }
    .back svg { width: 20px; height: 20px; }
    .profile { display: grid; grid-template-columns: .85fr 1.15fr; overflow: hidden; border: 1px solid #ffffff20; border-radius: 26px; background: #1b2d41; box-shadow: 0 30px 90px #0005; }
    .portrait { width: 100%; height: 100%; min-height: 350px; max-height: 65dvh; object-fit: cover; object-position: center 30%; }
    .bio { padding: clamp(24px, 4vw, 48px); align-self: center; }
    h2 { font-size: clamp(1.7rem, 3.8vw, 2.8rem); font-weight: 500; letter-spacing: -.04em; margin: 0 0 10px; }
    .bio .role { margin: 0 0 26px; }
    .description { color: #d2deea; font-size: 1rem; line-height: 1.7; margin: 0 0 28px; }
    .website { display: inline-flex; align-items: center; gap: 14px; border-radius: 10px; padding: 13px 18px; background: #e0eaf4; color: #14263a; font-size: 1rem; text-decoration: none; font-weight: 500; }
    .website:hover { background: white; }
    .other { color: #adbed0; font-size: .875rem; margin: 22px 0 0; }
    @media (max-width: 580px) {
      .app { padding: 20px; }
      .person { border-radius: 16px; }
      .profile { grid-template-columns: 1fr; border-radius: 20px; }
      .portrait { height: 24dvh; min-height: 0; }
      .bio { padding: 22px; }
      .bio .role { margin-bottom: 14px; }
      .description { line-height: 1.5; margin-bottom: 18px; }
      .other { margin-top: 16px; }
      .back { margin-bottom: 10px; }
    }
    @media (max-height: 650px) {
      .heading { margin-bottom: 18px; }
      .portrait { min-height: 0; }
      .bio { padding: 18px; }
      .bio .role, .description { margin-bottom: 12px; }
      .other { margin-top: 12px; }
    }
    @media (max-height: 520px) {
      .profile { grid-template-columns: .6fr 1.4fr; }
      .portrait { height: 100%; max-height: 75dvh; }
      .bio { padding: 16px; }
      .back { margin-bottom: 6px; padding: 4px 0; }
      h2 { font-size: 1.5rem; }
      .description { line-height: 1.4; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="view" id="list-view">
      <header class="heading"><h1>The Armoun Family</h1></header>
      <div class="people">
        <button class="person" data-person="emad" aria-label="About Emad Armoun">
          <img src="images/emad.jpg" alt="Emad Armoun">
          <span class="person-label"><span class="name">Emad Armoun</span><span class="role">Software engineer</span></span>
        </button>
        <button class="person" data-person="vahid" aria-label="About Vahid Armoun">
          <img src="images/vahid.jpg" alt="Vahid Armoun">
          <span class="person-label"><span class="name">Vahid Armoun</span><span class="role">Traditional animator</span></span>
        </button>
      </div>
    </div>
    <div class="view" id="detail-view" hidden>
      <button class="back" id="back" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m12 5-7 7 7 7M5 12h15"/></svg>Back</button>
      <article class="profile" aria-labelledby="profile-name">
        <img class="portrait" id="profile-image" src="images/emad.jpg" alt="">
        <div class="bio">
          <h2 id="profile-name"></h2>
          <p class="role" id="profile-role"></p>
          <p class="description" id="profile-description"></p>
          <a class="website" id="profile-website" target="_blank" rel="noopener noreferrer">Visit website <span aria-hidden="true">↗</span></a>
          <p class="other">Other websites · Coming soon</p>
        </div>
      </article>
    </div>
  </main>
  <script>
    const people = {
      emad: { name: 'Emad Armoun', role: 'Software engineer', description: 'Emad is a software engineer with a passion for web development and design. He loves creating interactive and user-friendly applications.', website: 'https://emad.armoun.com', image: 'images/emad.jpg' },
      vahid: { name: 'Vahid Armoun', role: 'Traditional animator', description: 'Vahid is a 2D traditional animator.', website: 'https://vahid.armoun.com', image: 'images/vahid.jpg' },
    };
    const list = document.getElementById('list-view');
    const detail = document.getElementById('detail-view');
    const back = document.getElementById('back');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let selectedCard = null;
    let transitioning = false;

    async function switchView(from, to, focusTarget, reverse = false) {
      if (transitioning) return;
      transitioning = true;
      from.inert = true;
      to.inert = true;
      const duration = reducedMotion.matches ? 0 : 420;
      const direction = reverse ? -1 : 1;
      try {
        await from.animate([
          { opacity: 1, transform: 'translateX(0) scale(1)' },
          { opacity: 0, transform: `translateX(${-direction * 36}px) scale(.96)` },
        ], { duration: duration * .55, easing: 'ease-in', fill: 'forwards' }).finished;
        from.hidden = true;
        from.getAnimations().forEach(animation => animation.cancel());
        to.hidden = false;
        await to.animate([
          { opacity: 0, transform: `translateX(${direction * 44}px) scale(.96)` },
          { opacity: 1, transform: 'translateX(0) scale(1)' },
        ], { duration, easing: 'cubic-bezier(.16, 1, .3, 1)' }).finished;
      } finally {
        from.hidden = true;
        to.hidden = false;
        from.inert = false;
        to.inert = false;
        transitioning = false;
        focusTarget.focus({ preventScroll: true });
      }
    }

    document.querySelectorAll('[data-person]').forEach(card => {
      card.addEventListener('click', () => {
        if (transitioning) return;
        selectedCard = card;
        const person = people[card.dataset.person];
        document.getElementById('profile-name').textContent = person.name;
        document.getElementById('profile-role').textContent = person.role;
        document.getElementById('profile-description').textContent = person.description;
        const portrait = document.getElementById('profile-image');
        portrait.src = person.image;
        portrait.alt = person.name;
        document.getElementById('profile-website').href = person.website;
        switchView(list, detail, back);
      });
    });
    back.addEventListener('click', () => {
      if (!transitioning) switchView(detail, list, selectedCard, true);
    });
  </script>
</body>
</html>
